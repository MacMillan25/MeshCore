[env:Darktec_companion_radio_ble]
extends = Darktec_e22
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags = ${Darktec.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=DarktecDisplay
  -D PIN_BUZZER=1
  -D KEEP_DISPLAY_ON_USB
  -D WITH_COMPANION_CLI
  -DDISPLAY_TZ=\"MSK-3\"
; Метка сборки рядом с версией на заставке: "v1.17.1" + "SE" -> "v1.17.1 SE".
; Разделитель-пробел добавляет код: пробел внутри -D ломает командную строку,
; а дефис занят разделителем хеша коммита.
  -DFIRMWARE_VERSION_SUFFIX=\"SE\"
;  -D MESH_PACKET_LOGGING=1
  -D MESH_DEBUG=1
  -D CYRILLIC_SUPPORT=1
; Доп. страница дисплея: рельсы батареи и зарядника с INA3221 (В / А / Вт)
; плюс счётчик залитых мАч.
; Шунты 50 мОм уже заданы в [Darktec]: TELEM_INA3221_SHUNT_VALUE=0.050.
  -D UI_INA_PAGE=1
; Страница графика шумовой дорожки эфира.
  -D UI_NOISE_PAGE=1
; Тестовая страница батареи: напряжение, остаток ёмкости, ETA.
; Токи состояний для модели расхода — в DarktecBoard.h (DARKTEC_I_*).
  -D UI_BATT_PAGE=1
; Шумомер: ядро пересчитывает значение по умолчанию раз в 2 с. 500 мс даёт
; живой график; сам замер (64 отсчёта) не трогаем — интервал лишь разрешает
; начать новый цикл усреднения, и если отсчёты не успели набраться, замер
; просто продлевается. Радио при этом не дёргается.
  -D NOISE_FLOOR_CALIB_INTERVAL=500
; Страницы, убранные из листания кнопкой (см. ui-new/UITask.cpp).
  -D UI_NO_RECENT=1
  -D UI_NO_BLUETOOTH=1
  -D UI_NO_ADVERT=1
  -D UI_NO_GPS=1
build_src_filter = ${Darktec.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${Darktec.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0

; ---------------------------------------------------------------------------
; E22P-868M30S. Отличие от [env:Darktec_companion_radio_ble] ровно в одном:
; DARKTEC_RADIO_E22P меняет полярность управления RF-трактом (см. DarktecBoard.h).
; У E22P пин 6 это EN (общий enable PA+LNA), а не RXEN: при передаче он обязан
; оставаться высоким. Прежний конфиг ронял P0.17 в ноль на TX, EN выключался и
; PA не работал — наружу шли только ~100 мВт насквозь через закрытый ключ.
; Метка версии "E22P" вместо "SE", чтобы прошивки не путались.
;
; Всё остальное (UI-страницы, INA-телеметрия, CLI, кириллица, пины) то же самое,
; поэтому блоки продублированы из BLE-версии как есть — менять их надо в обоих
; местах, если что-то поменяется.
[env:Darktec_companion_radio_ble_e22p]
extends = Darktec_e22p
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags = ${Darktec_e22p_flags.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=DarktecDisplay
  -D PIN_BUZZER=1
  -D KEEP_DISPLAY_ON_USB
  -D WITH_COMPANION_CLI
  -DDISPLAY_TZ=\"MSK-3\"
; Метка сборки рядом с версией на заставке: "v1.17.1" + "E22P" -> "v1.17.1 E22P".
; Разделитель-пробел добавляет код: пробел внутри -D ломает командную строку,
; а дефис занят разделителем хеша коммита.
  -DFIRMWARE_VERSION_SUFFIX=\"E22P\"
;  -D MESH_PACKET_LOGGING=1
  -D MESH_DEBUG=1
  -D CYRILLIC_SUPPORT=1
; Доп. страница дисплея: рельсы батареи и зарядника с INA3221 (В / А / Вт)
; плюс счётчик залитых мАч.
; Шунты 50 мОм уже заданы в [Darktec]: TELEM_INA3221_SHUNT_VALUE=0.050.
  -D UI_INA_PAGE=1
; Страница графика шумовой дорожки эфира.
  -D UI_NOISE_PAGE=1
; Тестовая страница батареи: напряжение, остаток ёмкости, ETA.
; Токи состояний для модели расхода — в DarktecBoard.h (DARKTEC_I_*).
  -D UI_BATT_PAGE=1
; Шумомер: ядро пересчитывает значение по умолчанию раз в 2 с. 500 мс даёт
; живой график; сам замер (64 отсчёта) не трогаем — интервал лишь разрешает
; начать новый цикл усреднения, и если отсчёты не успели набраться, замер
; просто продлевается. Радио при этом не дёргается.
  -D NOISE_FLOOR_CALIB_INTERVAL=500
; Страницы, убранные из листания кнопкой (см. ui-new/UITask.cpp).
  -D UI_NO_RECENT=1
  -D UI_NO_BLUETOOTH=1
  -D UI_NO_ADVERT=1
  -D UI_NO_GPS=1
build_src_filter = ${Darktec_e22p_flags.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${Darktec_e22p_flags.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0

; ---------------------------------------------------------------------------
; E22P-868M30S. Отличие от [env:Darktec_companion_radio_ble] ровно в одном:
; DARKTEC_RADIO_E22P меняет полярность управления RF-трактом (см. DarktecBoard.h).
; У E22P пин 6 это EN (общий enable PA+LNA), а не RXEN: при передаче он обязан
; оставаться высоким. Прежний конфиг ронял P0.17 в ноль на TX, EN выключался и
; PA не работал — наружу шли только ~100 мВт насквозь через закрытый ключ.
; Метка версии "E22P" вместо "SE", чтобы прошивки не путались.
;
; Всё остальное (UI-страницы, INA-телеметрия, CLI, кириллица, пины) то же самое,
; поэтому блоки продублированы из BLE-версии как есть — менять их надо в обоих
; местах, если что-то поменяется.
[env:Darktec_sensor]
extends = Darktec_e22
build_flags =
