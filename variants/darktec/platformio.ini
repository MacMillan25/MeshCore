[Darktec]
extends = nrf52_base
board = promicro_nrf52840
build_flags = ${nrf52_base.build_flags}
  -I variants/darktec
  -D NRF52_POWER_MANAGEMENT
  -D DARKTEC
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=DarktecSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_BOARD_SCL=7
  -D PIN_BOARD_SDA=8
  -D PIN_OLED_RESET=-1
  -D PIN_USER_BTN=6
  -D PIN_GPS_RX=3
  -D PIN_GPS_TX=4
  -D PIN_GPS_EN=5
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BME280=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_INA3221=1
  -D ENV_INCLUDE_INA219=1
  -D TELEM_INA3221_SHUNT_VALUE=0.050
  ; Защита: DARKTEC_BATT_PROTECT_OFF | DARKTEC_BATT_PROTECT_ADC (см. battery_chemistry.h).
  ; OFF — без auto cutoff (нет bootlock/AUTO_SHUTDOWN); ADC — full sleep/wake.
  ; Hibernate/CLI — SYSTEMOFF; ADC-wait только у защиты батареи.
  -D DARKTEC_BATT_PROTECT=DARKTEC_BATT_PROTECT_ADC
  ; Батарея: BATTERY_CHEM_LIION | BATTERY_CHEM_LIFEPO4 | BATTERY_CHEM_LTO
  ; Li-ion/LiFePO4: только cells=1. LTO: cells=1 или 2 (макс. пакет 5 В).
  -D BATTERY_CHEMISTRY=BATTERY_CHEM_LIION
  -D BATTERY_CELLS=1
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/sensors>
  +<../variants/darktec>
lib_deps= ${nrf52_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
  adafruit/Adafruit INA3221 Library @ ^1.0.1
  adafruit/Adafruit INA219 @ ^1.2.3
  adafruit/Adafruit AHTX0 @ ^2.0.5
  adafruit/Adafruit BME280 Library @ ^2.3.0
  adafruit/Adafruit BMP280 Library@^2.6.8
  stevemarple/MicroNMEA @ ^2.0.6
  end2endzone/NonBlockingRTTTL @ ^1.3.0

; ---------------------------------------------------------------------------
; База по радиомодулю. Роли (ретранслятор, комната, компаньон, датчик, KISS)
; от модуля не зависят, поэтому у каждой роли пара env: имя без суффикса — E22,
; имя с суффиксом _e22p — E22P. Отличие ровно в одной строке extends.
;
; Про ${Darktec_e22p_flags}: интерполяция ${Section.key} разворачивает переменные
; СВОЕЙ секции и цепочку extends не проходит. Поэтому флаг модуля вынесен в
; отдельную секцию _flags — на неё и ссылаются env. Если написать
; ${Darktec_e22p_flags.build_flags} внутри самой [Darktec_e22p], PlatformIO ругается
; на бесконечную рекурсию.
;
; Метка версии на заставке: E22 -> "v1.17.1 SE", E22P -> "v1.17.1 E22P".
[Darktec_e22]
extends = Darktec

[Darktec_e22p]
extends = Darktec

[Darktec_e22p_flags]
extends = Darktec
build_flags = ${Darktec.build_flags}
  -D DARKTEC_RADIO_E22P=1

[env:Darktec_repeater]
extends = Darktec_e22
build_src_filter = ${Darktec.build_src_filter}
  +<../examples/simple_repeater>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
build_flags =
  ${Darktec.build_flags}
  -D ADVERT_NAME='"Darktec Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D DISPLAY_CLASS=SSD1306Display
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps = ${Darktec.lib_deps}
  adafruit/RTClib @ ^2.1.3

[env:Darktec_repeater_e22p]
extends = Darktec_e22p
build_src_filter = ${Darktec_e22p_flags.build_src_filter}
  +<../examples/simple_repeater>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
build_flags =
  ${Darktec_e22p_flags.build_flags}
  -D ADVERT_NAME='"Darktec Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D DISPLAY_CLASS=SSD1306Display
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps = ${Darktec_e22p_flags.lib_deps}
  adafruit/RTClib @ ^2.1.3

[env:Darktec_repeater_bridge_rs232_serial1]
extends = Darktec_e22
build_src_filter = ${Darktec.build_src_filter}
